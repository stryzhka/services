services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus
    networks:
      - app
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - GF_SECURITY_USER_PASSWORD=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafanadata:/var/lib/grafana
    networks:
      - app
  gateway:
    container_name: gateway
    build:
      context: ./Gateway
      dockerfile: Gateway.Api/Dockerfile
    ports:
      - "8000:8000"
    networks:
      - app
    environment:
      - ASPNETCORE_URLS=http://+:8000
    depends_on:
      - auth-service
      - user-service
      - objects-service
  auth-service:
    container_name: auth-service
    build:
      context: ./Auth
      dockerfile: Auth.Api/Dockerfile
    networks:
      - app
    environment:
      - ConnectionStrings__MongoDB=mongodb://admin:admin@mongodb:27017/?authSource=admin
      - Kafka__BootstrapServers=kafka:29092
      - Jwt__Key=${JWT_KEY:-dev-only-super-secret-do-not-use-in-production-please-change-it}
      - Jwt__Issuer=auth-service
      - Jwt__Audience=internal-api
      - Jwt__ExpiresMinutes=60
      - OpenApi__ServerUrl=http://localhost:8000
      - ASPNETCORE_URLS=http://+:5018
  user-service:
    container_name: user-service
    build:
      context: ./Confirmation
      dockerfile: Confirmation.Api/Dockerfile
    networks:
      - app
    environment:
      - ConnectionStrings__MongoDB=mongodb://admin:admin@mongodb:27017/test?authSource=admin
      - Kafka__BootstrapServers=kafka:29092
      - Kafka__GroupId=obj-to-users
      - ASPNETCORE_URLS=http://+:5016
  objects-service:
    container_name: objects-service
    build:
      context: ./webapi
      dockerfile: Dockerfile
    volumes:
      - ./webapi:/go/src/app
    ports:
      - "8080:8080"
    networks:
      - app
    environment:
      - port=8080
      - MONGODB_URI=mongodb://admin:admin@mongodb:27017/test?authSource=admin
      - redis_uri=redis:6379
      - redis_password=redis
      - kafka_uri=kafka:29092
      - JWT_KEY=${JWT_KEY:-dev-only-super-secret-do-not-use-in-production-please-change-it}
      - JWT_ISSUER=auth-service
      - JWT_AUDIENCE=internal-api
  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=test
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
    volumes:
      - './data:/data/db'
    networks:
      - app
  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning --requirepass redis
    volumes:
      - cache:/data
    networks:
      - app
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - app

  kafka-ui:
      image: provectuslabs/kafka-ui:latest
      container_name: kafka-ui
      ports:
        - "8081:8080"
      environment:
        KAFKA_CLUSTERS_0_NAME: local
        KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      depends_on:
        kafka:
          condition: service_healthy
      networks:
        - app
networks:
  app:
    driver: bridge
volumes:
  cache:
  grafanadata:
  prometheusdata:
